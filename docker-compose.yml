services:
  vedio-workflow:
    build: .
    image: vedio-workflow:latest
    container_name: vedio-workflow
    restart: unless-stopped
    ports:
      - "5080:5000"        # 左侧为 NAS 对外端口，按需修改
    environment:
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
      # ---- 火山引擎 ASR / TTS（字幕生成、音效生成）----
      - VOLC_APP_ID=${VOLC_APP_ID:-}
      - VOLC_ACCESS_TOKEN=${VOLC_ACCESS_TOKEN:-}
      - VOLC_SECRET_KEY=${VOLC_SECRET_KEY:-}
      - VOLC_API_KEY=${VOLC_API_KEY:-}
      - VOLC_RESOURCE_ID=${VOLC_RESOURCE_ID:-}
      - VOLC_RESOURCES=${VOLC_RESOURCES:-}
      # ---- 对象存储（上传文件、音效持久化）----
      - COZE_BUCKET_ENDPOINT_URL=${COZE_BUCKET_ENDPOINT_URL:-}
      - COZE_BUCKET_NAME=${COZE_BUCKET_NAME:-}
    # 变量实际值写在同目录 .env 文件中（会被 .dockerignore 排除，不会打进镜像）
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
