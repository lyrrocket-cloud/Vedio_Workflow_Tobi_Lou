services:
  vedio-tobi:
    build: .
    image: vedio-tobi:latest
    container_name: vedio-tobi-lou
    restart: unless-stopped
    ports:
      - "3003:5000"
    environment:
      - NODE_ENV=production
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
      - DATA_STORAGE_PATH=/app/data
    env_file:
      - .env
    volumes:
      - vedio_tobi_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frpc:
    image: frpc:local
    container_name: vedio-tobi-frpc
    restart: unless-stopped
    command: ["-c", "/frpc.toml"]
    volumes:
      - ./frpc.toml:/frpc.toml:ro
    depends_on:
      - vedio-tobi

volumes:
  vedio_tobi_data:
